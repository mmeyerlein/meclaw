# Pinned, deliberately (GH #406).
#
# This said `channel = "stable"`, and an unpinned channel makes the gate depend
# on the calendar: `3a1f9858` passed clippy at 20:29Z on 2026-08-25 and the
# byte-identical `crates/meclaw-core/` failed it at 21:48Z, because CI's stable
# had moved to 1.98.0 (released 2026-08-20) and that release promotes
# `result_large_err` to a lint `-D warnings` denies. Nothing about the code was
# different between the two runs — only the day.
#
# It also made "green locally" mean nothing: development here runs 1.95.0, so
# the two toolchains were never the same and CI was the first place a new lint
# was ever seen — at the worst moment, in the middle of a release.
#
# So the version moves when somebody moves it, in a commit that says so and can
# be reverted. Raising it is a small piece of deliberate work, not something
# that happens to a release.
#
# Raised to 1.98.0 on 2026-08-26 (GH #406), which is that piece of work: the
# four `result_large_err` sites the 1.98 release denies were boxed in the same
# commit that moves this line, so the toolchain and the code that satisfies it
# arrive together and revert together. The rule the incident bought stands —
# the next raise is a commit of its own, with its lints handled before it, not
# a stable channel drifting underneath a tag.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
