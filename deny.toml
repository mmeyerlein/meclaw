# cargo-deny configuration — dependency license allowlist + RUSTSEC advisory gate.
# Added: Phase-16 W7 Doc-Takt (Audit S4-License-2, ruling A, 2026-06-13).
# Run: `cargo deny check`  (install: `cargo install cargo-deny`).
# Schema: cargo-deny v2 ([advisories]/[licenses] `version = 2`).

[advisories]
version = 2
# RUSTSEC security-advisory gate: any vulnerability in the dependency tree fails
# the check (v2 default behavior). Yanked crates are also rejected.
yanked = "deny"
# No advisory currently suppressed. Add `"RUSTSEC-YYYY-NNNN"` entries here only
# with a written rationale.
ignore = []

[licenses]
version = 2
# Permissive-only allowlist. The full transitive tree is 100% permissive as of
# the S4 license sweep (327 third-party packages, Cargo.lock 2026-05-26): MIT /
# Apache-2.0 dominance plus the BSD/ISC/Zlib/0BSD/Unicode-3.0/BSL-1.0/MIT-0/
# CDLA-Permissive-2.0 long tail. `r-efi` carries
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later`; the SPDX `OR` resolves to MIT/Apache
# (both allowed) → no copyleft obligation, no explicit crate exception needed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The workspace's own crates are proprietary (`publish = false`,
# `license-file = "LICENSE"`, all rights reserved) — they are not OSS deps and
# must not be checked against the permissive allowlist.
private = { ignore = true }
exceptions = []

[bans]
# POC tree tolerates duplicate transitive versions; tighten post-freeze if churn
# becomes a problem.
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
