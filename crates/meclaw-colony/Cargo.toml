[package]
name = "meclaw-colony"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
meclaw-core = { path = "../meclaw-core", version = "0.20.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "1"
uuid = { version = "1", features = ["v7"] }
cel = "0.13.0"

[dev-dependencies]
meclaw-testing = { path = "../meclaw-testing" }
tempfile = "3"

[features]
test-hooks = []
