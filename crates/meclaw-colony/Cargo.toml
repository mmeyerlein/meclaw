[package]
name = "meclaw-colony"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
# `net` (ruling O-639-9): `surfaces::HandedConnection` carries a `tokio::net::TcpStream`
# in a public field, so the feature belongs in this crate's own manifest -- it was
# reaching the build through a dev-dependency, which a published crate does not have.
# Since GH #1168 it comes from `[workspace.dependencies]`, which still lists `net`;
# cargo writes the inherited entry into the published manifest of this crate.
tokio = { workspace = true }
tracing = { workspace = true }
meclaw-core = { path = "../meclaw-core", version = "0.67.0" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
thiserror = "1"
uuid = { workspace = true }
cel = "0.13.0"

[dev-dependencies]
# Paused tokio clock for the time-logic test class (OR-TV-1/OR-TV-4); dev-only, never in a release build.
tokio = { workspace = true, features = ["test-util"] }
meclaw-testing = { path = "../meclaw-testing" }
tempfile = { workspace = true }

[features]
test-hooks = []
