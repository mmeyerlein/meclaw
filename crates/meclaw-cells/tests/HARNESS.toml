# Harness table of meclaw-cells: which integration-test file folds into which
# test binary. Read by scripts/harness_fold.py (--plan/--apply/--unfold/--check).
# Cut by cell type / hive: first by the hive helper a file declares (`uses`,
# a regex on the tests/-relative helper path), then by the stem (`match`).
# A stem no rule matches goes to `misc`; a harness above max_files splits into
# <name>_1.._n. First matching rule wins.
max_files = 60
keep = []

[[rule]]
uses = "^support/presenter_colony\\.rs$"
harness = "presenter"

[[rule]]
uses = "^support/display_colony\\.rs$"
harness = "display"

# The bank of constructed walls (GH #1465) is one binary of its own: folded into
# `curator` its 22 files would shift every later file one part further.
[[rule]]
match = "^gh_d58_bank_"
harness = "curator_walls"

# D58 plant (GH #1490): the two pins of the planted kinds of the wall
# `over_aim` sit beside the bank's pins in the same binary.
[[rule]]
match = "^gh_d58_plant_"
harness = "curator_walls"

# D58 brief (GH #1496): the pins of the dated transcript and the dropped
# invented dates sit beside the bank's pins that measure the brief; in
# `curator` the file would shift every later file one part further.
[[rule]]
match = "^gh_d58_brief_"
harness = "curator_walls"

# The pins of an errand that ends without an answer (GH #1469), for the same
# reason: `curator_4` holds 57 files, nine more would open a fifth part and
# move files of other strands into it.
[[rule]]
match = "^gh_d58_errand_"
harness = "curator_errands"

# d54g b3err: the pins of a failed backend call (quick_bridge) that must reach ./errors sit beside the errand pins; in `curator` they would shift every later file one part further.
[[rule]]
match = "^gh_d54g_b3err_"
harness = "curator_errands"

# D58 target (GH #1483): the four pins of the llm cell's profile go to `llm`,
# the other pins of the strand to a binary of their own -- nineteen more files
# in `curator` would shift every later file one part further.
[[rule]]
match = "^gh_d58_target_(an_llm_cell_carries|a_changed_profile_is_announced|a_set_override_of_the_profile_param|a_twin_announces)"
harness = "llm"

[[rule]]
match = "^gh_d58_target_"
harness = "curator_targets"

# D58 target, builder 5c: the pins of the intake's and the push's names sit
# beside the strand's pins, outside the fixed set the plan counts.
[[rule]]
match = "^d58_target_"
harness = "curator_targets"

# D58 judge (GH #1480): the route's two pins go to a binary of their own
# beside `assemble` (`assemble` holds 60 files; two more would split it into
# `assemble_1`/`assemble_2` and rename the binary other strands filter on);
# `binary(/assemble/)` still finds them. The other ten get a binary of their
# own for the same reason in `curator`; without these rules their stems would
# fall to `round` (`judge`).
[[rule]]
match = "^gh_d58_judge_(the_state_route_sends|off_sends_no_ask|a_refused_view)"
harness = "assemble_judge"

[[rule]]
match = "^gh_d58_judge_"
harness = "curator_judge"

# The pins of the registered sidecar sections (GH #1473): one binary of their
# own, so no curator part moves; one of them drives the objects hive too.
[[rule]]
match = "^gh_d58_sections_"
harness = "curator_sections"

# D58 live (GH #1482): the nine pins of the live handle, one binary of their
# own for the same reason -- nine more files in `curator` would shift every
# later file one part further.
[[rule]]
match = "^gh_d58_live_"
harness = "curator_live"

# D58 followup (GH #1479): the pins of the open concern in the hive
# `assistant`, one binary of their own, so no curator part moves.
[[rule]]
match = "^gh_d58_followup_"
harness = "curator_followup"

# The pins of a note shown once with a receipt to its sender (GH #1477): one
# binary of their own, so no curator part moves.
[[rule]]
match = "^gh_d58_note_"
harness = "curator_notes"

# GH #1512: the pins of a turn note that reaches the target that speaks (a
# spec call writes no turn row, the row is bound to its target) sit beside
# the note pins, so no curator part moves.
[[rule]]
match = "^gh1512_"
harness = "curator_notes"

# D58 lead (GH #1474): the pins of the switch as a hive of its own, one
# binary of their own, so no curator part moves.
[[rule]]
match = "^gh_d58_lead_"
harness = "curator_lead"

# D58 frame (GH #1478): the ten pins of the frame slot and the note per stamp
# class, one binary of their own for the same reason -- no curator part moves.
[[rule]]
match = "^gh_d58_frame_"
harness = "curator_frame"

# D58 feed (GH #1481): the eleven pins of a feed ordered into a running
# session, one binary of their own, so no curator part moves.
[[rule]]
match = "^gh_d58_feed_"
harness = "curator_feed"

# D58 moveout (GH #1476): the twelve pins of the side call, the conditional
# feed and the interrupt ordered by the lead, one binary of their own, so no
# curator part moves.
[[rule]]
match = "^gh_d58_moveout_"
harness = "curator_moveout"

# D58 proof (GH #1475): the pin of simple-agent beside the template's own pins
# (it grows the agent with `simple_agent_loop`); the pin of a fifth model cell
# in a binary of its own, so no curator part moves.
[[rule]]
match = "^gh_d58_proof_simple_agent_"
harness = "simple_agent"

[[rule]]
match = "^gh_d58_proof_"
harness = "curator_proof"

# d54g (GH #1502): the pins of the wave in binaries of their own or beside their
# hive's pins, set by the coordinator in the opening commit (no strand edits this
# file). They stand before the first `uses` rule: the helpers `curator_hive` and
# `assemble_cell` would otherwise take the files into `curator` or `assemble`,
# and `assemble` stands at max_files.
[[rule]]
match = "^gh_d54g_oneanswer_once"
harness = "assemble_once"

[[rule]]
match = "^gh_d54g_(oneanswer_repeat|ack_typing)"
harness = "proxy"

[[rule]]
match = "^gh_d54g_ack_lead"
harness = "curator_lead"

[[rule]]
match = "^gh_d54g_ack_listen"
harness = "curator_live"

[[rule]]
match = "^gh_d54g_stamp_route"
harness = "assemble_judge"

# d54g latesafe (GH #1562): the late-stamp pins sit beside the stamp-route pins.
[[rule]]
match = "^gh1562_"
harness = "assemble_judge"

# d54g decidebs (GH #1564): the wake of the one bound sits beside the late-stamp pins.
[[rule]]
match = "^gh1564_"
harness = "assemble_judge"

# d54g listennote: the pin of the collector seam sits beside the stamp-route pins; in `assemble` it would shift every later file one part further.
[[rule]]
match = "^gh_d54g_listennote_seam"
harness = "assemble_judge"

# d54g listennote: the pins of the silent section turn sit beside the ack-listen pins in `curator_live`; in `curator` they would shift every later file one part further.
[[rule]]
match = "^gh_d54g_listennote"
harness = "curator_live"

[[rule]]
match = "^gh_d54g_stamp_notes"
harness = "curator_frame"

# d58-3 (GH #1522): the pins of the wave beside their hive's pins, set by the
# coordinator in the opening commit (no strand edits this file); before the
# first `uses` rule for the same reason as the d54g rules above.
[[rule]]
match = "^gh_d583_kern_route"
harness = "assemble_judge"

[[rule]]
match = "^gh_d583_(kern|namen)_"
harness = "curator_targets"

[[rule]]
match = "^gh_d583_(grenzen|wort)_"
harness = "curator_sections"

[[rule]]
match = "^gh_d583_(tag|ballast)_"
harness = "curator_walls"

# d58-3 suche (GH #1531): the history search finds every row of the wall
# through the ledger's full-text index, not a capped scan.
[[rule]]
match = "^gh_d583_suche_"
harness = "curator_walls"

# d58-3 nachlese oc9 (GH #1539): the pin of a brief cut off inside a line; in
# `curator` the file would open a sixth part and shift every later file.
[[rule]]
match = "^gh_d583_oc9_"
harness = "curator_walls"

[[rule]]
match = "^gh_d583_schnell_"
harness = "curator_lead"

# d58-3 treue (Paket Kurator-Treue, OR-583-79): the recall pin beside the
# memory pins, the rest beside the curator's targets.
[[rule]]
match = "^gh_d583_treue_recall_"
harness = "memory"

# d58-3 treue (T1): the pins of the frame of an own answer of another
# session beside the wave's other window pins.
[[rule]]
match = "^gh_d583_treue_"
harness = "curator_targets"

# GH #1532 (strand raten): the memory hive's pins of the row's rate and image
# cost beside the memory hive's own pins.
[[rule]]
match = "^gh_d583_raten_mem_"
harness = "memory"

# GH #1532 (strand raten): the curator's pins of the row's image cost and the
# start window's share beside the sections pins, and the route's beside the
# route's judge pins.
[[rule]]
match = "^gh_d583_raten_cur_"
harness = "curator_sections"

[[rule]]
match = "^gh_d583_raten_route_"
harness = "assemble_judge"

# GH #1556 (wave jevr): the route's pins of the decisions providers' form beside
# the route's judge pins.
[[rule]]
match = "^gh1556_the_route_"
harness = "assemble_judge"

# GH #1558 (wave jevr, strand kalib): the route's pin of the uncalibrated
# decider beside the route's judge pins; the cell's and the registry's pins of
# the calibration beside the other llm pins (in `misc` they would open a ninth
# part and move the files of other strands).
[[rule]]
match = "^gh1558_the_route_"
harness = "assemble_judge"

[[rule]]
match = "^gh1558_"
harness = "llm"

# GH #1532 (strand raten, point 4): the push's pin of the row's image cost on
# the memory ask beside grenzen's pin of its rate (curator_sections).
[[rule]]
match = "^gh_d583_raten_push_"
harness = "curator_sections"

# GH #1532 (strand raten, fix round Important): the live pin -- a real llm
# answer, its row's rate and image cost across the shipped edges -- beside
# the push's pin.
[[rule]]
match = "^gh_d583_raten_live_"
harness = "curator_sections"

# GH #1532 (strand raten): the rate pins of the five producers beside their
# gh1085 budget pins (file space), and the one rule of the fallback windows
# beside gh1085_fallback_windows_match_the_catalog.
[[rule]]
match = "^gh_d583_raten_cells_"
harness = "file_space"

[[rule]]
match = "^gh_d583_raten_fallback_"
harness = "misc_1"

[[rule]]
match = "^gh_d54g_kprofil_window"
harness = "curator_live"

[[rule]]
match = "^gh_d54g_kprofil_feed"
harness = "curator_feed"

# GH #1540 (d54g horizon): the pins of the feeds of a delegation round sit
# beside the feed's pins, so no curator part moves.
[[rule]]
match = "^gh1540_"
harness = "curator_feed"

# GH #1436 (d54g d58rest, OR-54g-62): the pins of the carried note sit beside
# the corpus of the curator they guard, so no curator part moves.
[[rule]]
match = "^gh1436_[f-k]_"
harness = "curator_3"

[[rule]]
uses = "^support/curator_hive\\.rs$"
harness = "curator"

[[rule]]
uses = "^support/file_space_hive\\.rs$"
harness = "file_space"

[[rule]]
uses = "^support/(graph_space_|librarian_|projection_hive|objects_hive)"
harness = "graph_space"

[[rule]]
uses = "^support/memory_hive_subject\\.rs$"
harness = "memory"

[[rule]]
uses = "^support/(duplex_cell|speaker_road)\\.rs$"
harness = "duplex"

[[rule]]
uses = "^support/(assemble_cell|organism_assistant)\\.rs$"
harness = "assemble"

[[rule]]
uses = "^support/web_fixture\\.rs$"
harness = "web"

# GH #1541: the pin that a page above the cut arrives whole through GET and
# join is a web-cell lock; in `misc` the one new file would open a ninth part
# and move 333 files of other strands.
[[rule]]
match = "^gh1541_"
harness = "web"

[[rule]]
uses = "^support/(gh929_|round_race)"
harness = "member_road"

[[rule]]
match = "voice|duplex|speaker"
harness = "voice"

[[rule]]
match = "mcp|stdio"
harness = "mcp"

[[rule]]
match = "proxy|slack|telegram"
harness = "proxy"

[[rule]]
match = "web|canvy"
harness = "web"

[[rule]]
match = "builder"
harness = "builder"

[[rule]]
match = "timer|clock"
harness = "timer"

[[rule]]
match = "store|vault|grant|access"
harness = "store"

[[rule]]
match = "round|judge|fitness"
harness = "round"

[[rule]]
match = "^(phase|p1[0-9]|paket)_"
harness = "phase"

[[rule]]
match = "llm|openai|responses"
harness = "llm"

[[rule]]
match = "sandbox|code|harness_"
harness = "code"

[[rule]]
# the simple-agent template pins (GH #1292): a harness of their own
match = "^simple_agent_"
harness = "simple_agent"

[[rule]]
# the figure template pins (GH #1267, #1292): a harness of their own, so misc keeps its eight parts
match = "^figure_"
harness = "figure"

[[rule]]
# the watcher pins of GH #1444 (calendar line, stats way, role figures) and
# of GH #1463 (the window watch as role figures): a harness of their own, so
# misc keeps its eight parts
match = "^(gh_d38_w1_|gh_d58_form_the_argus_)"
harness = "watcher"

[[rule]]
# the argus door's role and goal filter (GH #1493): beside the other argus
# pins in `watcher`, so no misc part moves (in misc it shifted 334 files one
# part further and left 209 doc links dangling)
match = "^gh1493_"
harness = "watcher"
