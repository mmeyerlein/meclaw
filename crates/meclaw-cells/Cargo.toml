[package]
name = "meclaw-cells"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
meclaw-core = { path = "../meclaw-core", version = "0.30.0" }
meclaw-colony = { path = "../meclaw-colony", version = "0.30.0" }
# GH #380 / R-W8-4 (sanctioned with the W8 spec, 2026-08-24): the `web` cell
# owns an HTTP + WebSocket listener, so a server library enters `meclaw-cells`
# for the first time. R-W8-4 released the library choice for exactly this
# element — "all Rust libraries that support this are released", scoped to the
# display substrate — and axum is what the workspace already speaks, so this
# adds no new crate to the tree, only a second consumer of one. `ws` only:
# the cell serves a LiveView socket, it never parses a multipart body.
axum = { version = "0.7", features = ["ws"] }
# GH #381: the LiveView serving machinery, extracted so a cell can speak the
# protocol without depending on the HTTP API.
meclaw-surface = { path = "../meclaw-surface", version = "0.30.0" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
croner = "3"
chrono = "0.4"
# P8 (sanctioned 2026-08-08): killing a whole process group needs killpg,
# which std does not expose. Used for exactly four symbols (killpg, SIGTERM,
# SIGKILL, pid_t) in one unix-only module, `stdio_child/reap.rs`.
libc = "0.2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Vault (sanctioned 2026-08-16): the crypto area of the tech-stack allow-list.
# RustCrypto, one choice per job — argon2id derives the key from a passphrase,
# XChaCha20-Poly1305 seals each secret, HMAC-SHA256 is what `vault.use` does
# WITH a secret instead of handing it out, getrandom supplies nonces and salt.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
# R3 / GH #421 (sanctioned ruling, 2026-08-26): the sealed-box delivery needs
# a Diffie-Hellman group and nothing else — the AEAD, the KDF input and the
# random source are already here. `static_secrets` lets the key be built from
# the `getrandom` bytes we already draw, so no `rand`/`rand_core` joins the tree.
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "static_secrets"] }

[dev-dependencies]
tempfile = "3"
meclaw-testing = { path = "../meclaw-testing" }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
