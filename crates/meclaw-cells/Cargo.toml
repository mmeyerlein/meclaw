[package]
name = "meclaw-cells"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
meclaw-core = { path = "../meclaw-core" }
meclaw-colony = { path = "../meclaw-colony" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
croner = "3"
chrono = "0.4"
# P8 (sanctioned 2026-08-08): killing a whole process group needs killpg,
# which std does not expose. Used for exactly four symbols (killpg, SIGTERM,
# SIGKILL, pid_t) in one unix-only module, `stdio_child/reap.rs`.
libc = "0.2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tempfile = "3"
meclaw-testing = { path = "../meclaw-testing" }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
