[package]
name = "meclaw-cells"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
meclaw-core = { path = "../meclaw-core", version = "0.72.0" }
meclaw-colony = { path = "../meclaw-colony", version = "0.72.0" }
# GH #380 / R-W8-4 (sanctioned with the W8 spec, 2026-08-24): the `web` cell
# owns an HTTP + WebSocket listener, so a server library enters `meclaw-cells`
# for the first time. R-W8-4 released the library choice for exactly this
# element — "all Rust libraries that support this are released", scoped to the
# display substrate — and axum is what the workspace already speaks, so this
# adds no new crate to the tree, only a second consumer of one.
# GH #1024 (owner, 05.10.2026: "stack upgrade as fast as possible"): axum 0.8,
# and no `ws` feature any more. axum's socket sits on tungstenite, and no
# tungstenite release implements permessage-deflate (RFC 7692) — it even
# refuses a frame with RSV1 set. The sockets are served by `crate::websocket`:
# axum's extractor shape, a frame codec of its own (`tokio-util`'s `Framed`,
# `bytes`), and `flate2`, which was here already.
axum = { workspace = true }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
# GH #639 / ruling O-639-2: a connection accepted by the CLI's one listener is
# handed to the cell that mounted the name it asked for, and serving a stream
# that is already accepted is one hyper call — the one `axum::serve` makes per
# accept. Both crates sit in `Cargo.lock` behind axum already, so this
# declares an edge rather than adding a crate.
hyper = { workspace = true }
hyper-util = { workspace = true }
# GH #381: the LiveView serving machinery, extracted so a cell can speak the
# protocol without depending on the HTTP API.
meclaw-surface = { path = "../meclaw-surface", version = "0.72.0" }
tokio = { workspace = true }
tracing = { workspace = true }
# GH #1002 (R-H4-3, the owner's go under AGENTS.md rule 6): the gzip variant of a
# large text asset or client file, computed ONCE when the snapshot is loaded --
# never per request. Already in the lock through hdrhistogram (1.1.9, the
# default miniz_oxide backend); no new backend, no new crate in the tree.
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
croner = "3"
chrono = "0.4"
# P8 (sanctioned 2026-08-08): killing a whole process group needs killpg,
# which std does not expose. Used for exactly four symbols (killpg, SIGTERM,
# SIGKILL, pid_t) in one unix-only module, `stdio_child/reap.rs`.
libc = "0.2"
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# Vault (sanctioned 2026-08-16): the crypto area of the tech-stack allow-list.
# RustCrypto, one choice per job — argon2id derives the key from a passphrase,
# XChaCha20-Poly1305 seals each secret, HMAC-SHA256 is what `vault.use` does
# WITH a secret instead of handing it out, getrandom supplies nonces and salt.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
# R3 / GH #421 (sanctioned ruling, 2026-08-26): the sealed-box delivery needs
# a Diffie-Hellman group and nothing else — the AEAD, the KDF input and the
# random source are already here. `static_secrets` lets the key be built from
# the `getrandom` bytes we already draw, so no `rand`/`rand_core` joins the tree.
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "static_secrets"] }

[dev-dependencies]
# Paused tokio clock for the time-logic test class (OR-TV-1/OR-TV-4); dev-only, never in a release build.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
meclaw-testing = { path = "../meclaw-testing" }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
