[package]
name = "meclaw-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
jsonschema = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Paused tokio clock for the time-logic test class (OR-TV-1/OR-TV-4); dev-only, never in a release build.
tokio = { workspace = true, features = ["test-util"] }
