[package]
name = "meclaw"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Where agents build agents. An open-source Rust framework for complex agentic systems. This crate ships the `meclaw` CLI/daemon binary."
repository = "https://github.com/mmeyerlein/meclaw"

[[bin]]
name = "meclaw"
path = "src/main.rs"

[dependencies]
meclaw-cli = { path = "../meclaw-cli", version = "0.66.0" }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

# GH #1168: the integration tests that start the binary live here, so
# `CARGO_BIN_EXE_meclaw` is the shipped binary and the workspace links it once.
# These are the dev-dependencies they moved with from meclaw-cli; the
# third-party ones inherit version and features from [workspace.dependencies]
# (precheck lock `feature-unity-lock`). None of them reaches the published binary.
[dev-dependencies]
# Paused tokio clock for the time-logic test class (OR-TV-1/OR-TV-4); dev-only, never in a release build.
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
meclaw-cells = { path = "../meclaw-cells" }
meclaw-colony = { path = "../meclaw-colony" }
meclaw-core = { path = "../meclaw-core" }
meclaw-testing = { path = "../meclaw-testing" }
