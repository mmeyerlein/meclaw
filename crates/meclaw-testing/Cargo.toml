[dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
meclaw-core = { path = "../meclaw-core" }
meclaw-colony = { path = "../meclaw-colony" }
rusqlite = { version = "0.39", features = ["bundled"] }
tracing = "0.1"
