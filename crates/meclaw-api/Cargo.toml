[package]
name = "meclaw-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
# `multipart`: `POST /messages` takes uploads.
#
# GH #1024 (owner, 05.10.2026: stack upgrade): axum 0.8. `ws` is gone: this
# crate serves no socket since GH #383, and the sockets of the listener are
# served by `meclaw-cells::websocket` (permessage-deflate), not by axum's
# tungstenite-based extractor.
axum = { workspace = true }
# GH #639 / ruling O-639-2: the API router also serves connections the CLI's one
# listener accepted and did not hand to a mount, and serving a stream that is
# already accepted is one hyper call — the one `axum::serve` makes per accept.
# Both crates sit in `Cargo.lock` behind axum already, so this declares an
# edge rather than adding a crate. `meclaw-cells` carries the same two lines for
# the mounted half of the same listener.
hyper = { workspace = true }
hyper-util = { workspace = true }
# 0.27 drops the unmaintained `proc-macro-error` (RUSTSEC-2024-0370) that
# maud_macros 0.26 pulled in; API surface used here (Markup/html!/DOCTYPE) is
# unchanged. Issue #127.
maud = "0.27"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
meclaw-core = { path = "../meclaw-core", version = "0.71.0" }
meclaw-colony = { path = "../meclaw-colony", version = "0.71.0" }
# GH #383: `meclaw-surface` is gone from here. GH #381 moved the LiveView
# machinery out of this crate so the `web` cell could speak the protocol without
# depending on the HTTP API; #383 removed this crate's last consumer of it (the
# `/surface/*` route). The crate stays — the `web` cell is its consumer now.

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
# Paused tokio clock for the time-logic test class (OR-TV-1/OR-TV-4); dev-only, never in a release build.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
# Phase 12-B T8: meclaw-testing as a dev-dep — the handler integration tests in
# tests/misc/phase_12_b_routes.rs drive a real colony task via
# `meclaw_testing::ColonyHandle::new()` and pass its `inbox_tx` on to a
# `meclaw_api::ColonyHandle`. Stays strictly [dev-dependencies] (rule 6).
meclaw-testing = { path = "../meclaw-testing" }
