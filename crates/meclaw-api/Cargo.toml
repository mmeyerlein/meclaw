[package]
name = "meclaw-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — install the `meclaw` crate for the binary; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
# `multipart`: `POST /messages` takes uploads.
#
# `ws` was sanctioned for GH #159 (a surface's client is a LiveView client, and
# nothing moves after the dead render without a transport). GH #383 retired that
# route, so this crate serves no socket any more and the feature is unused here.
# It is left in place because removing a feature is a Cargo.toml change of its
# own (CLAUDE.md rule 6) and `meclaw-cells` enables `ws` anyway — the built axum
# is byte-identical either way. Reported, not taken. (GH #396: `meclaw-surface`
# used to be the second crate named here; it binds no server any more.)
axum = { version = "0.7", features = ["multipart", "ws"] }
# 0.27 drops the unmaintained `proc-macro-error` (RUSTSEC-2024-0370) that
# maud_macros 0.26 pulled in; API surface used here (Markup/html!/DOCTYPE) is
# unchanged. Issue #127.
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "time"] }
tracing = "0.1"
anyhow = "1"
meclaw-core = { path = "../meclaw-core", version = "0.30.0" }
meclaw-colony = { path = "../meclaw-colony", version = "0.30.0" }
# GH #383: `meclaw-surface` is gone from here. GH #381 moved the LiveView
# machinery out of this crate so the `web` cell could speak the protocol without
# depending on the HTTP API; #383 removed this crate's last consumer of it (the
# `/surface/*` route). The crate stays — the `web` cell is its consumer now.

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
# Phase 12-B T8: meclaw-testing as a dev-dep — the handler integration tests in
# tests/phase_12_b_routes.rs drive a real colony task via
# `meclaw_testing::ColonyHandle::new()` and pass its `inbox_tx` on to a
# `meclaw_api::ColonyHandle`. Stays strictly [dev-dependencies] (rule 6).
meclaw-testing = { path = "../meclaw-testing" }
