[package]
name = "meclaw-surface"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — the Phoenix-LiveView wire format, session tokens and vendored client bundles used by the `web` cell; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
# GH #396: the list is this short because the crate is pure protocol arithmetic
# now — a frame codec, a session token and two vendored bundles read with
# `include_str!`. It binds neither a server nor a runtime: the socket that used
# to need `axum`/`tokio`/`tracing` and a colony handle went with `render` and
# `socket`, and JSON comes through `meclaw_core::serde_json` as it always did.
meclaw-core = { path = "../meclaw-core", version = "0.27.0" }
