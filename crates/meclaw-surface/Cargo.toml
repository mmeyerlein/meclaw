[package]
name = "meclaw-surface"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Internal crate of the MeClaw substrate — the LiveView serving machinery shared by the HTTP API and the `web` cell; the library API is not stable."
repository = "https://github.com/mmeyerlein/meclaw"
license.workspace = true

[dependencies]
# GH #381: this crate IS the surface machinery that used to live in
# `meclaw-api/src/surface/`. It keeps that crate's own sanctioning for `ws`
# (GH #159, sanctioned 2026-08-17): a surface's client is a LiveView client,
# which is a socket client — HTTP carries only the dead render, and nothing
# moves after that without a transport. `multipart` stays behind in
# `meclaw-api`, which needs it for its own upload route; the surface machinery
# never parses a multipart body.
axum = { version = "0.7", features = ["ws"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "time"] }
tracing = "0.1"
meclaw-core = { path = "../meclaw-core", version = "0.23.0" }
meclaw-colony = { path = "../meclaw-colony", version = "0.23.0" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
