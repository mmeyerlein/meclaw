name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Two reasons, and the second one was an accident that earned its keep.
  #
  # The stated one: the advisory database moves without anyone committing here,
  # so `deny` has to run on a clock -- otherwise a fresh RUSTSEC entry stays
  # unseen until the next unrelated pull request.
  #
  # The one found in practice (2026-08-17): the schedule runs the WHOLE
  # workflow, so the suite is executed weekly against a commit nobody touched.
  # That is the only thing in this project that can catch a flaky test after
  # the fact -- a push-triggered run tests a change, and a change that passes
  # once looks settled. The first scheduled run ever found a repair from the
  # night before that had swapped one race for a subtler one. Keep it whole;
  # narrowing this to the `deny` job would save minutes and lose that.
  schedule:
    - cron: "17 5 * * 1"
  # A red scheduled run needs a second opinion, and asking for one should not
  # require an empty commit. Without this, the only way to re-test the exact
  # commit the cron tripped on is to push something -- which changes the thing
  # under test. (Found the hard way on 2026-08-17.)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The public test suite compiles 400+ test binaries; with debuginfo the
  # target tree outgrows the 14 GB a hosted runner has free (W13: the run
  # died on ENOSPC in the middle of the build). Tests do not need line info.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Incremental compilation pays for itself when the same target directory is
  # compiled twice. A runner compiles it once and throws it away, so all the
  # scheme does here is write incremental state nobody reads -- and that state
  # is large enough to matter for the ENOSPC ceiling above.
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------
  # Fast fail. fmt + clippy used to sit in front of the test step in one
  # long job, so a formatting slip cost the full suite before it was
  # reported (measured 2026-08-27: fmt 3s, clippy 47s, test 10m43s -- the
  # 50s verdict arrived eleven minutes late).
  #
  # It is deliberately NOT a `needs:` of the test job. Chaining would put
  # those 50s in front of every shard's build and lengthen the critical
  # path to save runner minutes we are not paying for. Parallel means the
  # lint verdict lands about a minute in, while the suite keeps running --
  # and a red lint is visible on the run long before the tests finish.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key: clippy builds dependencies as `check` artifacts
          # (.rmeta), the test job needs them as real rlibs. Sharing one key
          # would hand the test shards a cache "hit" that still forces a full
          # dependency rebuild.
          shared-key: lint
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------
  # The suite, cut into shards. Two changes over the old single `cargo test`
  # step, and they attack the two halves of the 10m43s it took:
  #
  #   1. cargo-nextest instead of cargo test. `cargo test` runs the ~650 test
  #      BINARIES one after another and only threads within each one; nextest
  #      runs tests from different binaries at the same time. The measured
  #      sum of per-binary wall time was 404s, with the longest single binary
  #      at 30s -- i.e. the old run was mostly waiting.
  #   2. `--partition count:N/3`, so the run time is divided again across
  #      three runners.
  #
  # Each shard builds its own test binaries rather than downloading a
  # `nextest archive` from a build job. That is deliberate: the build is
  # ~3m50s and would sit in FRONT of every shard as a serial stage, plus the
  # transfer of a multi-hundred-megabyte archive. Built per shard, the three
  # builds run at the same time, and the dependency half of the build comes
  # out of the shared cache below -- no shard compiles a dependency twice.
  # It costs runner minutes, not wall clock, and runner minutes are free on
  # a public repository.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      # Same reasoning as `--no-fail-fast` below, one level up: if shard 2
      # fails, shards 1 and 3 must still report. A cancelled shard hides
      # every defect it was carrying.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # All three shards compile the identical dependency graph, so they
          # share one cache entry.
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `--no-fail-fast` because the default stops at the first failing test,
      # and this suite has 650+ binaries. A red run then reports one defect
      # and hides every other -- W3's export CI showed exactly one of two
      # identically-caused vacuity-floor failures, so the fix session repaired
      # one, pushed, and found the second on the next run (GH #356). One run
      # should cost one round, not one defect. (The `ci` profile in
      # .config/nextest.toml sets `fail-fast = false` as well; the flag is
      # repeated here so that the property survives a profile edit.)
      #
      # No `-E` filterset: this is tier t2 in the vocabulary of
      # scripts/test-tier.sh -- the whole suite. The tiers exist to make a
      # human's pre-commit loop cheap; CI has no reason to skip anything.
      # nextest is invoked directly rather than through that script because
      # the script wraps every run in the nice/ionice/flock hygiene that
      # belongs to the shared build machine, not to a dedicated runner.
      - name: test (shard ${{ matrix.shard }}/3)
        run: >
          cargo nextest run
          --workspace
          --profile ci
          --no-fail-fast
          --partition count:${{ matrix.shard }}/3
      # nextest does not run doctests -- it has no way to, they are rustdoc's.
      # `cargo test --doc` keeps them in the run; it is cheap here because the
      # libraries are already built by the step above (measured: ~2s for all
      # seven crates). One shard is enough, doctests do not partition.
      - name: doctests
        if: matrix.shard == 1
        run: cargo test --workspace --doc
      # The `ci` profile writes JUnit XML. Keeping it makes a red shard
      # readable without scrolling a log.
      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace

  # The rules that used to live only in a document and in somebody's memory.
  gates:
    runs-on: ubuntu-latest
    # No rust-cache here on purpose: every step below is bash or python over
    # text. The job used to restore a Rust cache it never read.
    steps:
      - uses: actions/checkout@v4
      # Two frozen function bodies in crates/meclaw-colony/src/colony.rs,
      # byte-compared against their reference under .github/fixtures/.
      - name: corridor byte gates
        run: .github/gates/corridor_byte_gates.sh
      # CONTRIBUTING bans unwrap()/expect() outside tests. The clippy lints for
      # it are allow-by-default, so `-D warnings` in the lint job never saw
      # them. This pins the existing count per package and fails when it grows.
      - name: unwrap/expect budget
        run: python3 .github/gates/unwrap_budget.py
      # docs/development-rules.md § 2a (GH #254). A review compares code
      # against spec, so a spec that runs ahead of the code passes every review
      # by construction. This runs the other direction: every behavioural claim
      # in the trias is classified, a `pinned` row names a test that must
      # exist, a `specified-not-built` row's paragraph must still carry its
      # visible marker in both language versions, and no row's anchor may be
      # rewritten out from under it.
      #
      # The registry's canonical home is plans/spec-claims/claims.tsv, which
      # does not travel (export rule R2). The copy at .github/gates/claims.tsv
      # is what this step reads -- same arrangement as the corridor fixtures.
      #
      # This run checks the travelling copy against the PUBLISHED documents:
      # the export ships docs/X.en.md under the plain name docs/X.md, so the
      # English half of every row is checked here and the German half is
      # skipped with a counted, named notice (its document does not travel).
      # The strict both-languages run, including the canonical-vs-copy
      # divergence, is a private-tree matter and rides the suite via
      # crates/meclaw-colony/tests/a3_spec_claims_gate_drift.rs.
      - name: spec-claims registry
        run: python3 scripts/check_claims.py --check
      # docs/development-rules.md § 2b (GH #319). An accepted ADR with nothing
      # in the tree holding it up is a wish: legacy ADR 0011 kept reading
      # `Akzeptiert` for three months after its capability had vanished, and the
      # spec kept promising it, because nothing connected the decision to a line
      # of code that could disappear. Every accepted ADR now names a test or a
      # symbol, and this step resolves each one.
      #
      # Same two-tree arrangement as the spec-claims gate above and for the same
      # reason: the corpus lives in plans/adr/, which does not travel (export
      # rule R2), so a DERIVED registry travels as .github/gates/adr-anchors.tsv
      # -- one row per anchor. This run resolves those rows against crates/,
      # which does travel, and crates/ is exactly where the deletion this gate
      # exists to catch would be visible. The private half -- the ADR texts
      # themselves, the missing-Pinned-by check, and the byte-exactness of the
      # derived copy -- rides the suite via
      # crates/meclaw-colony/tests/a4_adr_anchor_gate_drift.rs.
      - name: ADR anchors
        run: python3 scripts/check_adr_anchors.py --check
      # docs/development-rules.md § 5b (2026-08-28 ruling). A roadmap ages
      # without anybody touching it: the tracker moves, the file does not, and
      # a stream still naming work that shipped two releases ago reads as
      # current. Every stream bullet therefore names an OPEN issue or a
      # (register: <id>) row, and this step resolves both. The register does
      # not travel, so here only the tracker half is load-bearing -- the
      # register anchors are skipped and counted. An unreachable GitHub API is
      # a counted notice and exit 0, never a red build for somebody else's
      # outage.
      - name: roadmap anchors
        run: python3 scripts/check_roadmap_anchors.py --check
      # GH #234 -- a gate USED to stand here: `build_librarian_seed.py --check`
      # (GH #205), guarding a committed tree that is generated. Do not put it
      # back. The generator lives under workshop/, which is not part of this
      # tree and is not meant to be, so the step could not pass here -- it
      # failed on a missing file, which says nothing about whether the artifact
      # drifted. (A second such step, `build_builder_hive.py --check` (GH #217),
      # stood beside it; that generator was retired with its tree, GH #434.)
      #
      # It now runs where its sources are, in the tree that has workshop/, and
      # since GH #466 in three places rather than two -- because the two it had
      # were a release gate and a test tier that the pre-push rule does not run,
      # so between a commit and a release the drift was invisible:
      #   1. plans/meclaw-os/a2-pre-push-gates.sh, block 1 -- every push
      #   2. R11 of the release gate (plans/export-fixtures/make_export.py)
      #   3. crates/meclaw-cells/tests/librarian_seed_corpus.rs, in tier t1
      # The shipped Rust twin (3) covers this clone and skips when no generator
      # is present -- which here is always, so a green run of its own asserts
      # nothing about the corpus. That is intentional: the assertion belongs to
      # the tree that can make it.

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deterministic half: a verdict that depends only on this commit's
      # Cargo.lock and deny.toml. Blocking.
      - name: bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Time-dependent half: RUSTSEC advisories and crates.io yank state change
      # under a commit that never moved, so a red here is a report, not a
      # verdict on the pull request. It is deliberately not blocking; the
      # advisories standing open today are tracked in GH #127 (GH #115 is
      # where the split was decided).
      - name: advisories (reporting only)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
