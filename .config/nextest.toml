# ---------------------------------------------------------------------------
# SLOW BY DESIGN -- a longer leash, never a retry.
# ---------------------------------------------------------------------------
#
# The four-minute kill of the default profile says "a meclaw test that needs
# four minutes is wedged, not busy". The colony half of the B-proofs was busy:
# it booted a throwaway colony once and drove six real browser sessions through
# it -- two engines on three exits, with gestures and page loads in each,
# three and a half minutes measured. It is six tests now, one boot and one page
# each (W7); the raised cap stays for this binary until a lane run has measured
# the six under the station's load. `#[ignore]`d, run in `integration` and
# `release` (GH #746; station `browser:display`, scope `sheet+colony`).
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::710_the_colony_holds_in_both_engines_browser)'
slow-timeout = { period = "60s", terminate-after = 22 }

# The two leashes over the browser driver's own run marker (`RUN_HANG_MS`,
# workshop/tools/wait.mjs): the driver ends a hung run first and reports the proof
# it hung in, the harness kill stays behind it with room for what runs outside the
# marker (the colony's boot, the browser's launch, `browser.close()`). The marker is
# >= 3 x the loaded P95 of a run (TV-Z3/TV-K5): a colony line under `--load 12` on
# build03 ran 272-330 s (wave testing C1, n = 12), so the marker is 1020 s and the
# colony leash 22 x 60 s = 1320 s. At 690 s against 720 s a hung line ran into this
# kill 3 of 3 and lost its HANG line (re-check tv-bn-layout B, M1). The sheet marker
# is 330 s and its leash 9 x 60 s = 540 s. Over the driver's marker the test puts its
# own (`tests/support/browser_run.rs`, re-check M1-R): marker + 60 s outside it, then
# SIGTERM and a HANG mark, then SIGKILL, a HANG mark for the tree to be gone and a
# 10 s mark for the streams (re-check B fix2, M3/H1), then `HANG:` with the survivors
# and the stderr tail. A leash covers boot (colony) or page parts (themselves under a
# HANG marker), the stage, that marker, the SIGTERM, survivors and streams marks and
# 30 s: colony 60 + 30 + 1080 + 30 + 30 + 10 + 30 = 1270 s,
# sheet 30 + 390 + 30 + 30 + 10 + 30 = 520 s.
# The leash is laid out for factor 1: nextest knows no `MECLAW_TEST_TIME_FACTOR`, so
# whoever introduces a factor > 1 raises the leash in the same strand. Raise marker
# and leash together, never one of them
# (`708_... the_run_marker_sits_under_the_leash_with_room`).
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser)'
slow-timeout = { period = "60s", terminate-after = 9 }

# The same two leashes in the QUOTA profile (K8, OR-T17-15; Welle-Merge R<->N, NS;
# OR-T18-7): there the marks run scaled by `MECLAW_TEST_TIME_FACTOR`, the leash above
# knows no factor, and a profile's own overrides are read before the default ones. The
# profile is laid out for F = 3 like its own leash above (`QUOTA_TIME_FACTOR`,
# `meclaw_testing::deadline`; every quota run and measurement uses it), so the leash is
# the factor-1 end times 3, rounded up to whole 60 s: colony 1270 s x 3 = 3810 s ->
# 64 x 60 s = 3840 s, sheet 520 s x 3 = 1560 s -> 26 x 60 s. The scaled run marker inside
# stays >= 3 x the loaded P95 (1020 s x 3, 330 s x 3). A backstop behind the scaled
# marks, never a verdict; pinned in `708_... the_run_marker_sits_under_the_leash_with_room`.
[[profile.quota.overrides]]
filter = 'binary_id(=meclaw-cells::710_the_colony_holds_in_both_engines_browser)'
slow-timeout = { period = "60s", terminate-after = 64 }

[[profile.quota.overrides]]
filter = 'binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser)'
slow-timeout = { period = "60s", terminate-after = 26 }

# ---------------------------------------------------------------------------
# LONG TESTS FIRST -- `priority`, never a group or a leash (GH #1162, #1088).
# ---------------------------------------------------------------------------
#
# A test that starts in the tail of the `tests` station holds the station open
# for its own length after every other slot is idle. M0 measured the full
# suite on build04 at 24 threads (A4 j24, 469.7 s): 11094 tests, 47 of them
# above 30 s, 2009.2 s together, the longest 69.7 s (gh906). nextest starts
# higher priorities first ("a test priority between -100 and 100, inclusive;
# higher values run sooner", schema of cargo-nextest 0.9.143); the priority is
# the measured seconds of the slowest test of each source file, so the longest
# go first. One override per source file, the names as the harness fold gives
# them (`binary_id(=<crate>::<harness>) & test(=<stem>::<test>)`, GH #1119).
# These overrides set `priority` and nothing else: nextest resolves every
# setting on its own (the first matching override that sets it), so the
# groups and timeouts above stay exactly as they are. Pinned by
# scripts/tests/test_pipeline_ir_path.py (the 47 names, and that each one exists).
# gh906_a_repo_round_trips_through_the_hive: 1, longest 69.7 s
