# cargo-nextest profiles for the meclaw workspace.
#
# Two profiles, one difference in posture:
#
#   default  -- the local runner. Optimised for a human waiting at a terminal:
#               failures print immediately, nothing is retried, and a test that
#               hangs is killed rather than holding the run hostage.
#   ci       -- the machine runner. Same test set, but it reports slow tests
#               and flakes explicitly and writes a JUnit file for the summary.
#
# Neither profile decides WHICH tests run. A tier decides it by filterset
# (`scripts/test-tier.sh t0|t1|t2`); a gate run decides it from the diff --
# `scripts/gate.sh <mode>` asks `scripts/gate_plan.py` which binaries the change
# needs and hands the expression over as `scripts/test-tier.sh filter '<expr>'`.
# The stations and their triggers live in that resolver's docstring, the process
# around them in docs/development-rules.md § 7.
#
# Timeout budget: the repo convention is that a test's own failure-marker
# timeouts are generous (30s, so that cargo-parallel load does not fake a
# failure). The harness timeout therefore has to sit well above that, or it
# would turn a slow machine into a red suite. `slow-timeout.period` only marks
# a test SLOW and prints it; `terminate-after` is the count of periods after
# which the test is actually killed.

[profile.default]
# No retries by default. A red test is red -- see docs/development-rules.md.
retries = 0
# Keep going after the first failure: one run should name every broken test,
# not just the first one to trip.
fail-fast = false
failure-output = "immediate-final"
# "retry", not "fail": a retried attempt prints `TRY n FAIL` with its output. It
# costs nothing while nothing is retried, and on 24.09. a rescued attempt of a
# quarantined browser proof left no trace of WHY it had failed -- the one output
# the investigation needed (GH #714).
status-level = "retry"
final-status-level = "slow"
# 30s -> marked slow; 8 periods (4 min) -> killed. A meclaw test that needs
# four minutes is wedged, not busy.
slow-timeout = { period = "30s", terminate-after = 8 }

# The slow lock reads the times of GREEN tests from here (`scripts/slow_tests.py`,
# station `slow-tests`): a test above a third of its budget is red with its name
# (GH #1046 -- the display scenarios grew to 213 s of their 240 s unseen and were
# killed at 24 threads). Written to `<target>/nextest/default/junit.xml`.
[profile.default.junit]
path = "junit.xml"

# K8 (OR-T17-15): the leash of a QUOTA run (`scripts/lane_sync.sh` under
# MECLAW_LANE_CPU_QUOTA, the quota mark set inside the scope). The whole
# selection shares a capped core there: on 13.10. gh1061_the_organism ran
# 79 s alone under 80 % / F = 3 and past the 240 s of `default` beside 177
# others, busy to the last line (tv-br M10v). `scripts/test-tier.sh` picks this
# profile by the quota mark and by nothing else; every other run keeps
# `default`. The value is >= 3x the longest test measured in full scope under
# 80 % / F = 3 and >= F x the 240 s of `default`. Final 1020 s = 60 s x 17
# (tv-br report § M10m3): the highest P95 of any test is gh1061_the_organism
# with 327.0 s over three full-scope runs (its 16 gh1061 series runs: P95
# 123.5 s), 3 x 327.0 s = 981 s, rounded up to whole 60 s and held at the K8
# release of 1020 s; F x 240 s = 720 s. Inherits everything else from
# `default`.
[profile.quota]
slow-timeout = { period = "60s", terminate-after = 17 }

[profile.quota.junit]
path = "junit.xml"

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
# "retry" surfaces every retried attempt in the log, so a quarantined flake
# cannot pass quietly.
status-level = "retry"
final-status-level = "flaky"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# The two calls of the station `browser:display` (scripts/gate_plan.py,
# `browser_cmds`): the ignored browser locks and the sheet. Each runs with its
# own profile so each writes its own JUnit file (`target/nextest/<profile>/`)
# and neither overwrites the one the slow lock reads from `default`. Everything
# else -- timeouts, test groups, the overrides below -- is inherited from
# `default`: nextest applies the default profile's overrides to every profile,
# after the profile's own. Picked with `MECLAW_TIER_PROFILE=<name>` on
# `scripts/test-tier.sh`; without it the tier runs `default`, as before.
[profile.browser.junit]
path = "junit.xml"

[profile.browser-ignored.junit]
path = "junit.xml"

# GH #1161: the station's two parts -- every Chromium test, every WebKit test of
# the same union -- run side by side, so each has a profile (and a JUnit file) of
# its own; the names stand in `scripts/gate_plan.py` (`BROWSER_PROFILES`).
[profile.browser-chromium.junit]
path = "junit.xml"

[profile.browser-webkit.junit]
path = "junit.xml"

# OR-TB.S3.14 (GH #1161): a station never boots more colonies than it books.
# `browser:display` books three (`scripts/pipeline/plan.py`, `NEEDS`): one for the
# WebKit part (group `webkit`, one at a time) and two for the Chromium part, whose
# tests all boot a colony (`*_browser`). Without this override they fell through to
# `colony-boot` (four at a time), bounded only by the part's threads -- wider than
# the booking as soon as the part gets more threads. The profile's own override
# comes before the inherited ones, so it wins over `colony-boot`; the WebKit tests
# stay out of it and keep `webkit`. Two, not one: one at a time the Chromium part
# took 420 s on build02 (S3-diag), over the WebKit floor of 327 s.
# `scripts/tests/test_pipeline_lab_width.py` holds width == booking.
# The width is no number of its own (VORGABEN TV-B7): it is
# `pipeline/plan.py::browser_workers` over the station's booking,
# max(1, floor((cpu 4 - 0 cargo jobs) / 2)) = 2; change the booking, not this line
# alone (`TestBrowserWorkerFormula` fails until both agree).
[test-groups.chromium-part]
max-threads = 2

[[profile.browser-chromium.overrides]]
filter = 'binary_id(/_browser$/) & not test(/webkit/)'
test-group = "chromium-part"

# KR-TB-1 (d): the release station `scenario-tests` (`scripts/gate_plan.py`,
# SCENARIO_STATION) runs the scenario class beside `tests` on the same build; a
# profile of its own keeps the JUnit file `slow-tests` reads from `default`.
[profile.scenario.junit]
path = "junit.xml"

# W3 (GH #1117): the lane executor (`scripts/pipeline/executor.py`) runs
# several nextest stations of one run at the same time against the same
# build, and `scripts/test-tier.sh` deletes the JUnit file of its profile
# before every run -- two stations on one profile would delete and overwrite
# each other's. The flake isolation therefore runs a profile of its own.
[profile.isolate.junit]
path = "junit.xml"

# OR-TV-2 (VG TV-F3): the pipeline's NOTE station `quarantine` runs the
# quarantined tests here -- out of the blocking `tests` selection. No retries
# in this file: the run's own `quarantine.toml` (pipeline store) adds them per
# entry, each with `flaky-result = "fail"` -- a retry classifies, it never
# turns red green.
[profile.quarantine]
retries = 0
flaky-result = "fail"
fail-fast = false

[profile.quarantine.junit]
path = "junit.xml"

# TV-P2 (tv-p1c § 6): the perf tests (`perf_*`, all `#[ignore]`), run only by
# `scripts/test-tier.sh perf` with `--run-ignored only` -- never by t0-t2 or a
# gate station. One at a time and no retries: a perf number is a measurement.
[profile.perf]
retries = 0
test-threads = 1
fail-fast = false

[profile.perf.junit]
path = "junit.xml"

# welle-tb S1b (#1165): the browser-lock call of the coverage build
# (`scripts/pipeline/coverage_host.sh`). Its junit keeps the output of GREEN
# tests: a lock that could not drive its browser leaves green with one `SKIP `
# line, and `scripts/pipeline/browser_cover.py` marks a lock measured only
# without one. Everything else is inherited from `default`.
[profile.coverage-browser.junit]
path = "junit.xml"
store-success-output = true

# ---------------------------------------------------------------------------
# QUARANTINE -- the ONLY place where retries are allowed.
# ---------------------------------------------------------------------------
#
# House rule, non-negotiable:
#
#   1. Retries exist for tests whose flakiness is UNDERSTOOD AND TRACKED.
#      They are not a way to make a red test go away.
#   2. EVERY entry below needs an open GitHub issue, named in the comment on
#      the entry. No issue, no entry -- delete it instead.
#   3. An entry is a debt, not a state. When the issue closes, the entry goes.
#   4. Adding an entry does not lift the "red test = BLOCKED" rule: a test that
#      fails all its attempts is still a hard stop.
#   5. A retry classifies, it never turns red green (OR-TV-2, VG TV-F8): every
#      profile or entry with `retries > 0` carries `flaky-result = "fail"`.
#
# Format per entry:
#
#   [[profile.default.overrides]]
#   # GH #NNN -- one line on WHY it is flaky, not on what the test does.
#   filter = 'binary_id(=<crate>::<binary>) & test(=<test name>)'
#   retries = 2
#   flaky-result = "fail"
#
# TWO terms, and they are not interchangeable. `cargo nextest list` PRINTS
# `<crate>::<binary> <test name>`, but that spelling belongs in no filter:
# `test()` compares its matcher against the TEST NAME alone, and the binary is
# its own term, `binary_id()`. A test name carries no space and no crate, so
# `test(=<crate>::<binary> <test name>)` parses cleanly, matches nothing, and
# leaves the station green over an entry that does nothing -- which is exactly
# what the first #763 entry did for a whole wave (wave P review C1).
#
#   the whole binary   filter = 'binary_id(=meclaw-cells::w10b_remember_colony)'
#   two named tests    filter = 'binary_id(=meclaw-cells::w10b_remember_colony) \\
#                                 & (test(=a_broken_annotation_costs_the_answer_nothing) \\
#                                  + test(=an_annotated_turn_is_a_fact_candidate_on_the_turn_it_answered))'
#
# In a folded harness (`scripts/harness_fold.py`, GH #1119) the binary is the
# harness and a test is named `<stem>::<test>` after the file it lives in. A bare
# `test(=<test>)` matches nothing there and leaves the station green over a dead
# entry -- the #763 class again. Name the stem:
#
#   one test in a harness  filter = 'binary_id(=meclaw-cells::misc_5) & test(=gh669_x::a_test)'
#
#   5. An entry is proved, not written: `cargo nextest list -E '<filter>'` must
#      print exactly the tests the comment claims. The `nextest list` output
#      alone proves the spelling of a NAME, never the reach of a FILTER.
#      `scripts/tests/test_nextest_quarantine.py` holds the grammar half of
#      that rule without cargo; the list run is still yours.
#
# (The binary also lists `mock_openai::tests::*` -- those are the unit tests of
# a shared helper module, compiled into many binaries. Never quarantine those:
# one entry would silently retry the same helper everywhere.)
#
# --- current quarantine ----------------------------------------------------
# (GH #714, GH #763, GH #911, GH #956 and GH #968 closed with their
# measurements; an entry comes back only with a new issue behind it)

# ---------------------------------------------------------------------------
# LOUD WHEN GREEN -- the tests that may decide not to measure.
# ---------------------------------------------------------------------------
#
# `failure-output` says nothing about a test that PASSES, and the two gh766 tests
# below pass by returning early on a host that cannot delegate a cgroup or unshare a
# network namespace. That made the only measurement behind R-G13 -- "a denied
# network still bites without `no_new_privs`" -- able to be silently absent on
# any host, with a green station either way (GH #766, review I13). They now
# print one line on the way in, SKIPPED or MEASURED, and this override is what
# puts that line in the gate log. It is not a retry and not a leash: the two
# tests are strict.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh766_a_packaged_browser_needs_no_landlock) & (test(=the_cap_alone_sets_the_cap_and_no_flag) + test(=a_denied_network_still_bites_without_the_flag))'
success-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(=meclaw-cells::gh766_a_packaged_browser_needs_no_landlock) & (test(=the_cap_alone_sets_the_cap_and_no_flag) + test(=a_denied_network_still_bites_without_the_flag))'
success-output = "immediate-final"

# GH #867: the strict-CSP browser proof returns early -- `SKIP …` on stdout -- when
# this host has no node, no browser, no template library or no python. A gate log
# then read "1 passed" whether the page ran under `script-src 'self'` or nothing
# ran at all (wave fix, H1a review I1). The same remedy as above: print its line
# when green, in both profiles.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh867_a_display_runs_under_a_strict_csp_browser)'
success-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(=meclaw-cells::gh867_a_display_runs_under_a_strict_csp_browser)'
success-output = "immediate-final"

# GH #703: the two proofs of the phone sheet in a real engine. The WebKit proof
# said `SKIP ... missing dependencies` in every gate of this host -- it never
# loaded the laboratory the 710 proofs load -- and the sheet proof SKIPs in a
# linked worktree without `node_modules`; both read "passed" (wave fix, strand X,
# OR-FX.X.3). Every way out without a measurement prints one `SKIP ` line.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh703_the_phone_holds_in_webkit_browser) + binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser)'
success-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(=meclaw-cells::gh703_the_phone_holds_in_webkit_browser) + binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser)'
success-output = "immediate-final"

# GH #1210 (TV-B7, re-check tv-bn-drv2-fix1 § 5): the os-mark proof prints its
# driver's `THROTTLE` line, the one sign that a robustness probe ran braked;
# gh703 and gh867 above already show their green output.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::misc_6) & test(/^gh704_a_refused_channel_does_not_take_the_dock::/)'
success-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(=meclaw-cells::misc_6) & test(/^gh704_a_refused_channel_does_not_take_the_dock::/)'
success-output = "immediate-final"

# GH #1043 (review Z-M3, finding 5): the two SIGKILL locks print one line per
# round -- what arrived, and how many replayed answers the store's book gave
# after the kills. A green run whose kills replayed nothing proves nothing (the
# lock asserts `> 0`); the count belongs in the gate log, not only in the
# assertion.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh1043_a_killed_peer_stream_arrives_exactly_once) + binary_id(=meclaw-cells::gh1015_sigkill_chain_into_a_real_store)'
success-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(=meclaw-cells::gh1043_a_killed_peer_stream_arrives_exactly_once) + binary_id(=meclaw-cells::gh1015_sigkill_chain_into_a_real_store)'
success-output = "immediate-final"

# GH #1048: WebKit renders in software here (Mesa llvmpipe under
# `workshop/tools/wkenv.sh`), and llvmpipe spreads one page over every core of
# the host. Cut into parts (one per proof group), the sheet proof's WebKit parts
# ran side by side on a 12-thread lane and starved each other: 10 of 10 stress
# iterations red, 83-104 s each, `page.goto: Timeout 30000ms` and
# `waitForSelector … Timeout 10000ms` (build01, 2026-10-07). Every test that
# drives a WebKit page takes the cores it really uses and they take turns: the
# sheet parts, the phone sheet (gh703), and the WebKit tests of the colony
# proof (three lines of six), the motion lock (gh961) and the keep lock
# (gh1028), each of which is one test per engine. The filter is narrow on
# purpose -- `test(/webkit/)` inside those binaries: a whole binary here would
# put its Chromium tests in the one-at-a-time line too. The last term takes every
# WebKit test of a browser binary (gh958, gh964 among them): since GH #1161
# (re-check M-3) they run in the WebKit part of `browser:display`, never in
# `tests`, and must not meet another WebKit page there. A scheduling fact, not
# a longer leash: `slow-timeout` and `terminate-after` stay the profile's.
#
# A test is in exactly ONE group: of the overrides that set `test-group`, the
# first one that matches wins. So this override stands ABOVE `colony-boot`, and
# a test that boots a colony AND drives WebKit stays here
# (`scripts/tests/test_nextest_groups.py` holds both rules against the tree).
[test-groups.webkit]
max-threads = 1

# GH #1088: the tests that boot a heavy colony -- the display colony of
# `crates/meclaw-cells/tests/support/display_colony.rs` (python compose cells,
# a judge mock, mounts), the browser locks, the scenario class (`*_demo`,
# `e2e`, `workshop_scenario`). At full lane width (24 threads) too many of them
# at once ran the colony proof past its timeout, and the answer was a host-wide
# `threads=12` that halved every other test as well. This group caps the heavy
# boots at four at a time and lets the rest of the suite run at full width.
# The plain `bootstrap_from_filesystem` tests (a tiny colony each, a few
# hundred binaries) are not in it on purpose. No `threads-required`: the group
# width is the control, and a test that reserved more threads would idle the
# lane around it. `scripts/tests/test_nextest_groups.py` names every
# display-colony test missing below.
[test-groups.colony-boot]
max-threads = 4

[[profile.default.overrides]]
filter = '(binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser) & test(/^the_sheet_holds_in_webkit_/)) + binary_id(=meclaw-cells::gh703_the_phone_holds_in_webkit_browser) + ((binary_id(=meclaw-cells::710_the_colony_holds_in_both_engines_browser) + binary_id(=meclaw-cells::gh961_motion_by_target_state_browser) + binary_id(=meclaw-cells::gh1028_a_new_window_keeps_the_others_in_place_browser)) & test(/webkit/)) + (binary_id(/_browser$/) & test(/webkit/))'
test-group = "webkit"
threads-required = 4

[[profile.ci.overrides]]
filter = '(binary_id(=meclaw-cells::710_the_sheet_holds_in_both_engines_browser) & test(/^the_sheet_holds_in_webkit_/)) + binary_id(=meclaw-cells::gh703_the_phone_holds_in_webkit_browser) + ((binary_id(=meclaw-cells::710_the_colony_holds_in_both_engines_browser) + binary_id(=meclaw-cells::gh961_motion_by_target_state_browser) + binary_id(=meclaw-cells::gh1028_a_new_window_keeps_the_others_in_place_browser)) & test(/webkit/)) + (binary_id(/_browser$/) & test(/webkit/))'
test-group = "webkit"
threads-required = 4

# colony-boot, after `webkit` (first match wins): the browser locks and the
# scenario class by name ...
[[profile.default.overrides]]
filter = 'binary_id(/_browser$/) + binary_id(/_demo$/) + binary_id(/_demo_/) + binary_id(/e2e/) + binary_id(=meclaw-cells::workshop_scenario)'
test-group = "colony-boot"

# ... and the display-colony tests by binary, a few per entry so that a line
# stays readable.
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::710_a_verdict_comes_back_from_the_judge) + binary_id(=meclaw-cells::710_a_view_lives_in_the_store) + binary_id(=meclaw-cells::710_the_apps_write_what_the_pass_reads) + binary_id(=meclaw-cells::710_the_clock_strikes_what_the_curator_ordered) + binary_id(=meclaw-cells::710_the_screen_hears_only_what_is_said) + binary_id(=meclaw-cells::808_the_colony_view_stands_in_the_dock) + binary_id(=meclaw-cells::809_a_restart_reads_once_and_draws_the_same_screen)'
test-group = "colony-boot"

[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::809_no_header_carries_the_plan) + binary_id(=meclaw-cells::809_the_store_is_quiet_when_nothing_is_written) + binary_id(=meclaw-cells::gh1027_a_foreign_round_opens_no_window) + binary_id(=meclaw-cells::gh867_no_surface_page_carries_unlisted_inline_script) + binary_id(=meclaw-cells::gh958_a_mistyped_block_is_refused_at_the_door) + binary_id(=meclaw-cells::gh959_an_unplaceable_lead_yields_the_standard_block) + binary_id(=meclaw-cells::gh959_an_unsure_or_late_verdict_shows_nothing)'
test-group = "colony-boot"

[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh959_a_sure_verdict_opens_the_window_and_fills_it) + binary_id(=meclaw-cells::gh959_data_follows_the_verdict_and_builds_up) + binary_id(=meclaw-cells::gh963_a_declared_source_is_read_with_the_round) + binary_id(=meclaw-cells::gh963_a_search_fills_a_window_only_after_a_sure_verdict) + binary_id(=meclaw-cells::gh963_the_work_report_shows_steps_not_contents) + binary_id(=meclaw-cells::gh964_a_map_stands_on_a_running_screen) + binary_id(=meclaw-cells::gh965_the_data_question_names_the_screen_round)'
test-group = "colony-boot"

[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::gh965_the_member_residents_show_on_the_screen) + binary_id(=meclaw-cells::gh966_a_refusal_of_the_decider_reaches_the_stage) + binary_id(=meclaw-cells::gh966_a_set_of_other_rounds_is_no_set) + binary_id(=meclaw-cells::gh976_the_last_result_shows_only_to_its_round) + binary_id(=meclaw-cells::gh977_a_partial_verdict_keeps_the_sure_topic) + binary_id(=meclaw-cells::gh983_a_missing_resident_is_left_out)'
test-group = "colony-boot"

# A display-colony test folded into the `display` harness (GH #1210): folded
# form, the binary of before the fold matches nothing (#1153).
[[profile.default.overrides]]
filter = 'binary_id(=meclaw-cells::display) & test(/^gh1210_a_gesture_reaches_the_member_exactly_once::/)'
test-group = "colony-boot"

# GH #1164 (Z-INT-W § 2): the long tests of `LONG TESTS FIRST` below, at most
# four at a time. `priority` alone started all 47 together at the head of the
# station; on build01 (12 slots) twelve of them ran side by side, each 1.5-2.3x
# slower (gh974 62 s -> 135 s), and 12 went over the 80 s mark of slow-tests.
# Before #1162 they were spread over the run -- 2009 s of them in a 470 s
# station on build04 is 4.3 at a time on average -- and none went over in any
# full run of the wave. Four keeps that density on every lane and still starts
# the longest first: 2009 s / 4 = 502 s of chain beside ~460 s for the rest of
# the suite on the other 20 slots of build04; on build01 the station takes
# 1443 s anyway. A scheduling fact, not a leash: the marks stay the profile's.
# The two sheet tests stay in `colony-boot` (first match wins), so they are not
# named here. Each takes two slots (`threads-required = 2`): their colonies run
# four Tokio workers, and the head of the station overlaps the parallel stations
# of the run (gate-selftest, cpu 4, on build01 beside 12 slots on 12 vCPUs) --
# there gh906 alone still went 88.6 s over the 80 s mark. Two slots each keeps
# fewer light tests beside them; the group width stays four.
# Pinned by scripts/tests/test_pipeline_ir_path.py.
[test-groups.long-first]
max-threads = 4

[[profile.default.overrides]]
filter = '''
    (binary_id(=meclaw-cells::round_2) & test(=gh906_a_repo_round_trips_through_the_hive::a_repo_round_trips_through_the_hive))
