[workspace]
resolver = "3"
members = [
    "crates/meclaw-core",
    "crates/meclaw-colony",
    "crates/meclaw-cells",
    "crates/meclaw-api",
    "crates/meclaw-testing",
    "crates/meclaw-cli",
    "crates/meclaw",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
publish = true
rust-version = "1.85"
repository = "https://github.com/mmeyerlein/meclaw"
license = "MIT OR Apache-2.0"
